name: dealership-scanner

# Local Docker stack: Postgres (with pgvector) + web. Secrets: kmac vault (host.docker.internal:9999).
#
#   ./deploy/up.sh
#
# No scanner containers: scans run through backend/scripts/dealer_pipeline.py on a host, or on
# Railway scanner-nightly (Dockerfile.scanner). The dealer_jobs worker and scheduler services were
# removed in P15B.6 (D-REL1 deleted their Railway services on 2026-10-08).

x-scanner-env: &scanner-env
  ALLOW_UNENCRYPTED_USER_DB: "1"
  PYTHONPATH: /app
  KMAC_VAULT_AUTO: "1"
  VAULT_ADDR: http://host.docker.internal:9999
  VAULT_TOKEN_FILE: /run/secrets/kmac-vault-token
  DEALER_PORTAL_DB_PATH: /data/dealer_portal.db
  USERS_DB_PATH: /data/users.db
  DEV_USERS_DB_PATH: /data/dev_users.db
  INCOMPLETE_LISTINGS_DB_PATH: /data/incomplete_listings.db
  # Serving reads the dealer's remote URLs from cars.gallery, so local copies buy nothing.
  SCANNER_VDP_DOWNLOAD_IMAGES: "0"

services:
  postgres:
    # Prod's major and pgvector release (PG 18.6, vector 0.8.6; D-TC3). migrations/V001 runs
    # CREATE EXTENSION vector, which plain postgres images cannot satisfy.
    image: pgvector/pgvector:0.8.6-pg18
    container_name: dealership-scanner-postgres
    environment:
      POSTGRES_USER: dealership
      POSTGRES_PASSWORD: dealership
      POSTGRES_DB: dealership
    volumes:
      # PG 18+ images keep data under /var/lib/postgresql/18/docker and refuse to start when
      # anything is mounted at /var/lib/postgresql/data. A new volume name, so the old PG16
      # `postgres_data` volume is never handed to PG18 (left untouched; pg_upgrade or a dump
      # moves its data if anyone needs it).
      - postgres18_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dealership -d dealership"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  web:
    container_name: dealership-scanner-web
    build:
      context: ..
      dockerfile: Dockerfile.web
    image: dealership-web:dev
    ports:
      - "${WEB_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data/runtime:/data
      - ..:/app
      - ${HOME}/.config/kmac/docker-vault-token:/run/secrets/kmac-vault-token:ro
    environment:
      <<: *scanner-env
      FLASK_ENV: development
      INVENTORY_DATABASE_URL: postgresql://dealership:dealership@postgres:5432/dealership
      LISTINGS_INCLUDE_INCOMPLETE_CARS: "0"
      APP_ADMIN_USERNAMES: ${APP_ADMIN_USERNAMES:-asarrafi}
      APP_ADMIN_EMAILS: ${APP_ADMIN_EMAILS:-asarrafi@sarraficars.com}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ALLOW_APP_ADMIN_DEV_PASS_THROUGH: ${ALLOW_APP_ADMIN_DEV_PASS_THROUGH:-1}
      BILLING_STRIPE_ENABLED: ${BILLING_STRIPE_ENABLED:-0}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-}
      USERS_DB_ENCRYPTION_KEY: ${USERS_DB_ENCRYPTION_KEY:-}
      DEV_USERS_DB_ENCRYPTION_KEY: ${DEV_USERS_DB_ENCRYPTION_KEY:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      APPLE_OAUTH_CLIENT_ID: ${APPLE_OAUTH_CLIENT_ID:-}
      APPLE_OAUTH_TEAM_ID: ${APPLE_OAUTH_TEAM_ID:-}
      APPLE_OAUTH_KEY_ID: ${APPLE_OAUTH_KEY_ID:-}
      APPLE_OAUTH_PRIVATE_KEY: ${APPLE_OAUTH_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres18_data:
