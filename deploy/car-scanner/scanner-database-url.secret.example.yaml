# Example: Secret referenced by car-scanner CronJob as scanner-database-url.
#
# 1) Replace PASSWORD and namespace/host if needed (in-cluster DNS: postgres-service.NAMESPACE.svc.cluster.local).
# 2) kubectl apply -f scanner-database-url.secret.example.yaml
#
# Prefer generating from shell so the password is not stored in git:
#   kubectl create secret generic scanner-database-url \
#     --namespace default \
#     --from-literal=DATABASE_URL='postgresql://dealership:PASSWORD@postgres-service:5432/dealership'
#
apiVersion: v1
kind: Secret
metadata:
  name: scanner-database-url
  namespace: default
type: Opaque
stringData:
  DATABASE_URL: "postgresql://dealership:REPLACE_ME@postgres-service:5432/dealership"
