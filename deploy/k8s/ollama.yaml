apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: dealership
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      nodeSelector:
        purpose: database # Pins to Aorus
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        env:
          - name: OLLAMA_HOST
            value: "0.0.0.0"
        volumeMounts:
        - name: ollama-storage
          mountPath: /root/.ollama
      volumes:
      - name: ollama-storage
        hostPath:
          path: /home/asarrafi/ollama-models
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: dealership
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434