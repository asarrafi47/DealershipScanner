apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-web
  namespace: dealership
  labels:
    app: dealership-web
spec:
  replicas: 1
  # Recreate: only one pod at a time (SQLite single-writer + ReadWriteOnce PVC)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealership-web
  template:
    metadata:
      labels:
        app: dealership-web
    spec:
      # Pin to the node that owns the PVC data
      nodeSelector:
        role: data-node
      containers:
        - name: web
          image: REGISTRY/dealership-web:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dealership-config
            - secretRef:
                name: dealership-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dealership-data-pvc
