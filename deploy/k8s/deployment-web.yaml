apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-web
  namespace: dealership
  labels:
    app: dealership-web
spec:
  replicas: 1
  # Recreate: only one pod at a time (SQLite single-writer + ReadWriteOnce PVC)
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealership-web
  template:
    metadata:
      labels:
        app: dealership-web
    spec:
      # Pin to the Aorus (silversurfer) which owns the PVC data and the local image
      nodeSelector:
        purpose: database
      containers:
        - name: web
          # Match the exact name in the k8s.io namespace on silversurfer
          image: docker.io/library/dealership-scanner:latest
          # Tell K8s to use the local 10.7GB image instead of checking a registry
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: dealership-config
            - secretRef:
                name: dealership-secret
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dealership-data-pvc