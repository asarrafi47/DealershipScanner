apiVersion: batch/v1
kind: CronJob
metadata:
  name: dealership-enrichment
  namespace: dealership
spec:
  # Run nightly at 2 AM
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: dealership-enrichment
        spec:
          nodeSelector:
            role: data-node
          restartPolicy: OnFailure
          containers:
            - name: enrichment
              image: REGISTRY/dealership-scanner:latest
              imagePullPolicy: Always
              # Run the repair pipeline then re-score incomplete listings
              command:
                - bash
                - -c
                - |
                  python -m backend.scripts.repair_inventory_fields && \
                  python -m backend.dictionary.enrich_from_dictionary
              envFrom:
                - configMapRef:
                    name: dealership-config
                - secretRef:
                    name: dealership-secret
              volumeMounts:
                - name: data
                  mountPath: /data
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "250m"
                limits:
                  memory: "2Gi"
                  cpu: "1000m"
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: dealership-data-pvc
