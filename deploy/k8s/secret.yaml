# IMPORTANT: Replace all CHANGE_ME values before applying.
# Do NOT commit real secrets. Seal with Sealed Secrets or use:
#   kubectl create secret generic dealership-secret -n dealership \
#     --from-literal=SECRET_KEY="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_PASSWORD="changeme" \
#     --from-literal=ANTHROPIC_API_KEY="sk-ant-..." \
#     [--from-literal=RESEND_API_KEY="re_..."]
apiVersion: v1
kind: Secret
metadata:
  name: dealership-secret
  namespace: dealership
type: Opaque
stringData:
  SECRET_KEY: "CHANGE_ME"
  ADMIN_PASSWORD: "CHANGE_ME"
  ANTHROPIC_API_KEY: "CHANGE_ME"
  # Optional — required for email features
  RESEND_API_KEY: ""
  RESEND_FROM: ""
  # Optional — required for billing
  STRIPE_SECRET_KEY: ""
  STRIPE_PUBLISHABLE_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
