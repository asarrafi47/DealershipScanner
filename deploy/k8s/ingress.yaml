# Requires k3s Traefik ingress controller (default) or nginx-ingress.
# Replace YOUR_DOMAIN with the actual hostname.
# TLS via cert-manager: annotate with cert-manager.io/cluster-issuer: letsencrypt-prod
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dealership-ingress
  namespace: dealership
  annotations:
    # Uncomment for cert-manager TLS:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Force HTTPS redirect (Traefik):
    # traefik.ingress.kubernetes.io/router.entrypoints: websecure
    # traefik.ingress.kubernetes.io/router.middlewares: dealership-redirect-https@kubernetescrd
spec:
  rules:
    - host: YOUR_DOMAIN
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dealership-web
                port:
                  number: 80
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - YOUR_DOMAIN
  #     secretName: dealership-tls
