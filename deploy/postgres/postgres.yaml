# PostgreSQL for shared scanner inventory (multi-node CronJob workers).
#
# Prerequisites:
#   1) Longhorn installed; StorageClass "longhorn" exists.
#   2) Create credentials BEFORE Deployment/CronJob:
#        kubectl create secret generic postgres-credentials \
#          --namespace default \
#          --from-literal=POSTGRES_USER=dealership \
#          --from-literal=POSTGRES_PASSWORD='YOUR_STRONG_PASSWORD' \
#          --from-literal=POSTGRES_DB=dealership
#   3) Scanner CronJob needs DATABASE_URL (see deploy/car-scanner/cronjob.yaml). Example:
#        kubectl create secret generic scanner-database-url \
#          --namespace default \
#          --from-literal=DATABASE_URL='postgresql://dealership:YOUR_STRONG_PASSWORD@postgres-service:5432/dealership'
#
# Note: DealershipScanner inventory code is still largely SQLite-oriented. Using Postgres end-to-end
# requires a migration of backend/db/inventory_db.py (and related modules). This stack gives you the
# cluster database service; wire application support separately.
#
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: default
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-bookworm
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: default
  labels:
    app: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
