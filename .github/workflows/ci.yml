name: CI

# Remediation P2A.2. Every branch push runs CI, so work in progress is checked
# long before it reaches main; PRs to main and manual dispatch run it too.
# workflow_dispatch only shows up in the Actions UI once this file is on main.
# Tag pushes do not run: with only a `branches` filter, GitHub ignores tag refs,
# so no `tags-ignore` is needed.
#
# backend/tests/test_ci_workflow.py pins the triggers, permissions, job ids,
# `needs: lint`, timeouts, install order and the offline selection. Change both
# together. The release-guard job (P2A.4) runs only for pushes and PRs to main;
# backend/tests/test_release_tooling.py pins it.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run per branch (push) or per PR; a newer push cancels the older run,
# except on main, where every commit keeps its own result.
#
# A branch with an open PR to main runs twice per push (once as `push` in group
# refs/heads/<branch>, once as `pull_request` in group <PR number>). That is on
# purpose: an `if:` that skipped one of the two would leave skipped jobs on the
# same SHA, and a skipped job reports success, which can mask a red run.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Job ids `lint`, `pytest` and `pytest-integration` become required checks on
# main (remediation P2B.5). Do not rename them.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ruff must not land in requirements.txt (the runtime/deploy image) or in
      # requirements-test.txt (this job installs nothing else). Pin it here so a
      # new ruff release cannot turn a green branch red on its own.
      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    # Gate the (slow) test job on the (fast) lint job so a syntax error or an
    # undefined name fails in seconds instead of after the full requirements
    # install.
    needs: lint
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # D-TC5: the CPU-only torch wheel goes in first, so sentence-transformers
      # finds torch already satisfied and pip skips the multi-GB CUDA build.
      # Prod installs the default (CUDA) torch, so this is not image parity;
      # no test imports torch.
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      # backend/tests/test_js_unit.py runs the frontend helper tests under node
      # and skips when node is missing; pin the version so it really runs.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # pytest.ini's default `-m "not slow"` is replaced by any explicit -m, so
      # the wall-clock tier is excluded here by name. `pg` is the Postgres tier
      # (it needs a server this job does not have). TESTS_BLOCK_NETWORK=1 makes
      # backend/tests/conftest.py refuse non-loopback connects (remediation
      # P2A.3), so a test that reaches the internet fails here instead of
      # passing on luck. `--timeout` comes from pytest-timeout.
      - name: Run offline tests
        env:
          TESTS_BLOCK_NETWORK: "1"
        run: >-
          python -m pytest backend/tests
          -m "not integration and not slow and not pg"
          -q -p no:cacheprovider
          --timeout=300 --durations=40
          --junitxml=reports/offline.xml

      # Uploaded on failure too: the junit file is what the failure ledger
      # (remediation P2A.6) is built from.
      - name: Upload junit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-offline
          path: reports/offline.xml
          if-no-files-found: warn
          retention-days: 30

  # The offline job above excludes -m integration, so without this job a test
  # tagged @pytest.mark.integration would silently leave CI coverage entirely.
  #
  # The tier holds THREE tests today (2026-10-08), each gated on a live
  # Postgres this runner does not have, so all three skip here:
  #   - test_data_quality_invariants.py::test_live_seeded_regression_in_a_temp_table
  #     (DQ_INVARIANTS_LIVE_DB=1 plus an inventory DB holding epa_extended_specs)
  #   - test_merge_verified_specs_golden.py::test_merge_verified_specs_golden_live_db
  #     (MERGE_SPECS_GOLDEN_LIVE_DB=1 plus the local inventory DB, read-only)
  #   - test_schema_from_migrations.py::test_migrations_build_a_superset_of_the_runtime_ddl
  #     (SCHEMA_PARITY_PG_DSN: a server where scratch databases may be created)
  # The job therefore proves the tier collects and skips cleanly; it does NOT
  # exercise Postgres. The Postgres tier replaces it in remediation P14A
  # (D-TC6).
  #
  # Asset-gated tests (brochure PDFs, catalog DB) are deliberately NOT tagged
  # integration: they need local files, not a live stack, and are accounted for
  # by the ASSET-GATED SKIPS summary in backend/tests/conftest.py
  # (REQUIRE_LOCAL_ASSETS=1 turns those skips into failures).
  #
  # Exit code 5 (nothing collected) is NOT tolerated: if the tier ever empties
  # again this job fails instead of passing on zero tests.
  pytest-integration:
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      # Same install as the pytest job (D-TC5).
      - name: Install CPU-only torch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-test.txt

      - name: Run integration tier (skips without a live Postgres; fails if empty)
        run: python -m pytest backend/tests -m integration -q -p no:cacheprovider -rs

  # "Releasable?" (remediation P2A.4, D-REL3): VERSION must rise above main's
  # (semver, 1.5.10 > 1.5.9) and CHANGELOG.md must have a filled section for it.
  # D-REL3 keeps "every push bumps VERSION" in the local pre-push hook, but this
  # job judges ONLY pushes to main and PRs to main, so work-in-progress branch
  # pushes never go red on it. On other branches it shows as skipped by design;
  # it is not a stand-in for the test jobs, which always run.
  #
  # The base is what the commit would replace:
  #   - pull_request: the current main (HEAD is GitHub's PR merge commit);
  #   - push to main: github.event.before, the main this push replaced. Not
  #     origin/main: after the push that IS HEAD, and "HEAD already contained
  #     in the base" would pass every main push unseen;
  #   - workflow_dispatch on main: nothing to compare with (all zeros), so
  #     only the CHANGELOG section and a well-formed VERSION are checked.
  # python3 is the runner's own: the script is stdlib-only and 3.9-compatible.
  #
  # backend/tests/test_release_tooling.py pins this job (id, needs, if, fetch,
  # base selection). Change both together.
  release-guard:
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fetch main
        run: git fetch --no-tags --depth=50 origin +refs/heads/main:refs/remotes/origin/main

      - name: VERSION rises and CHANGELOG has its section
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          zero=0000000000000000000000000000000000000000
          case "$EVENT_NAME" in
            pull_request) base=origin/main ;;
            push) base="$BEFORE_SHA" ;;
            *) base="$zero" ;;
          esac
          if [ "$base" != origin/main ] && [ "$base" != "$zero" ]; then
            git fetch --no-tags --depth=1 origin "$base"
          fi
          python3 scripts/release_guard.py --base "$base"
