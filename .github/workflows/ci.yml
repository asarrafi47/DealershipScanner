name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No requirements-dev.txt in this repo, and ruff must not land in
      # requirements.txt (that file is the runtime/deploy image). Pin it here so a
      # new ruff release cannot turn a green PR red on its own.
      - name: Install ruff
        run: pip install ruff==0.15.22

      - name: Lint
        run: ruff check .

  pytest:
    runs-on: ubuntu-latest
    # Gate the (slow) test job on the (fast) lint job so a syntax error or an
    # undefined name fails in seconds instead of after the full requirements
    # install.
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run offline tests
        # pytest.ini's default ``-m "not slow"`` is replaced by any explicit -m,
        # so the wall-clock tier is excluded here by name.
        run: python -m pytest backend/tests -m "not integration and not slow" -q -p no:cacheprovider

  # The offline job above excludes -m integration, so without this job a test
  # tagged @pytest.mark.integration would silently leave CI coverage entirely.
  #
  # What this job actually covers today (2026-10-01): ONE test,
  # test_data_quality_invariants.py::test_live_seeded_regression_in_a_temp_table,
  # which needs a real Postgres holding the inventory schema
  # (INVENTORY_DATABASE_URL + DQ_INVARIANTS_LIVE_DB=1). This runner has neither,
  # so the job proves the integration tier collects and skips cleanly; it does
  # NOT exercise Postgres. Running it for real needs a postgres service with the
  # migration chain applied (docs/monolith_audit_2026_10_01/tests.md F3/F8).
  #
  # Asset-gated tests (brochure PDFs, catalog DB) are deliberately NOT tagged
  # integration: they need local files, not a live stack, and are accounted for
  # by the ASSET-GATED SKIPS summary in backend/tests/conftest.py
  # (REQUIRE_LOCAL_ASSETS=1 turns those skips into failures).
  #
  # Exit code 5 (nothing collected) is NOT tolerated any more: if the tier ever
  # empties again this job fails instead of passing on zero tests.
  pytest-integration:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration tier (skips without a live Postgres; fails if empty)
        run: python -m pytest backend/tests -m integration -q -p no:cacheprovider -rs
