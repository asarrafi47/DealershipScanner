[pytest]
testpaths = backend/tests
# Wall-clock tests (``slow``) are out of the default run: they measure the
# machine as much as the code. ``pytest -m slow`` runs only them. Any explicit
# ``-m`` on the command line replaces this default, so CI spells the exclusion
# out (see .github/workflows/ci.yml).
addopts = -m "not slow"
markers =
    integration: tests that require a live running stack or a live database (HTTP server, Postgres, external services)
    regression: scanner/pipeline regression tests gated separately in CI
    slow: wall-clock/timing tests that depend on machine speed or the shared dev DB; excluded by default, run with -m slow
    real_vpic_client: opt out of the autouse vPIC offline stub (backend/tests/conftest.py); the test mocks urlopen/requests itself
