<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="200" fill="#f8f9fa"/>

  <!-- Modern geometric car silhouette -->
  <g id="car-icon">
    <!-- Main body - sleek forward motion -->
    <path d="M 50 100 L 70 75 L 130 75 L 150 100 L 145 120 L 55 120 Z"
          fill="#0066ff" opacity="0.9"/>

    <!-- Front windshield accent -->
    <path d="M 75 85 L 95 80 L 100 90 L 80 92 Z"
          fill="#00a8ff" opacity="0.7"/>

    <!-- Back accent -->
    <path d="M 120 85 L 135 90 L 130 100 L 115 95 Z"
          fill="#0052cc" opacity="0.8"/>

    <!-- Wheels -->
    <circle cx="75" cy="125" r="8" fill="#1a1a1a"/>
    <circle cx="125" cy="125" r="8" fill="#1a1a1a"/>

    <!-- Wheel highlights -->
    <circle cx="75" cy="125" r="5" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.6"/>
    <circle cx="125" cy="125" r="5" fill="none" stroke="#0066ff" stroke-width="1.5" opacity="0.6"/>

    <!-- Motion lines -->
    <line x1="30" y1="95" x2="45" y2="95" stroke="#0066ff" stroke-width="2" opacity="0.5" stroke-linecap="round"/>
    <line x1="25" y1="105" x2="40" y2="105" stroke="#0066ff" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
  </g>

  <!-- Text area preparation -->
  <defs>
    <style>
      .logo-text { font-family: 'Arial', sans-serif; font-weight: 700; letter-spacing: 1px; }
      .logo-main { font-size: 24px; fill: #1a1a1a; }
      .logo-tagline { font-size: 10px; fill: #666; letter-spacing: 2px; }
    </style>
  </defs>
</svg>