<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
</head>
<body class="lp-body">

    <div class="page">

        {% set nav_active = "register" %}
        {% include "_nav_public.html" %}

        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Get Started</p>
                <h1>Create account</h1>

                {% if error %}
                <div class="error-box">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/register" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field-group">
                        <label>Username</label>
                        <input type="text" name="username" required>
                    </div>

                    <div class="field-group">
                        <label>Email</label>
                        <input type="text" name="email" required>
                    </div>

                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>

                    <button type="submit" class="primary-button full-width">Register</button>
                </form>

                <p class="auth-footer">Already have an account? <a href="/login">Login</a></p>
            </div>
        </section>

    </div>

    <script src="{{ url_for('static', filename='main.js') }}" nonce="{{ csp_nonce }}"></script>
</body>
</html>
