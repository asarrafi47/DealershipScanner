{# Inline SVG icons — no emoji. Usage: {% from '_icons.html' import icon %} {{ icon('home', 18) }} #}
{% macro icon(name, size=18, class='') -%}

{%- if name == 'home' %}

{%- elif name == 'inventory' %}
  <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
{%- elif name == 'dashboard' %}
  <rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>
{%- elif name == 'dealers' %}

{%- elif name == 'premium' %}

{%- elif name == 'compare' %}

{%- elif name == 'arrow-left' %}

{%- elif name == 'arrow-right' %}

{%- elif name == 'chevron-left' %}
  <path d="M15 6l-6 6 6 6"/>
{%- elif name == 'chevron-right' %}

{%- elif name == 'external' %}

{%- elif name == 'bell' %}

{%- elif name == 'star' %}

{%- elif name == 'check' %}

{%- elif name == 'key' %}

{%- elif name == 'shield' %}
  <path d="M12 3l8 4v6c0 5-3.5 8.5-8 9-4.5-.5-8-4-8-9V7l8-4z"/>
