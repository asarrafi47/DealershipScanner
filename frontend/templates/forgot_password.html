<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot password</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
    {% include "_head_perf.html" %}
</head>
<body class="lp-body">
    <div class="page">
        {% set nav_active = "login" %}
        {% include "_nav_public.html" %}

        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Account</p>
                <h1>Forgot password</h1>

                {% if error %}
                <div class="error-box">{{ error }}</div>
                {% endif %}
                {% if success %}
                <div class="success-box">{{ message }}</div>
                {% endif %}

                {% if not success %}
                <form method="POST" action="{{ url_for('forgot_password_page') }}" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field-group">
                        <label>Username or email</label>
                        <input type="text" name="login" required>
                    </div>
                    <button type="submit" class="primary-button full-width">Send reset link</button>
                </form>
                {% endif %}

                <p class="auth-footer"><a href="{{ url_for('login_page') }}">Back to login</a></p>
            </div>
        </section>
    </div>
{% include "_footer_version.html" %}
</body>
</html>
