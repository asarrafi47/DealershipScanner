<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
</head>
<body class="lp-body">

    <div class="page">

        {% set nav_active = "login" %}
        {% include "_nav_public.html" %}

        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Welcome</p>
                <h1>Login</h1>

                {% if error %}
                <div class="error-box">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field-group">
                        <label>Username or Email</label>
                        <input type="text" name="login" required>
                    </div>

                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>

                    <button type="submit" class="primary-button full-width">Login</button>
                </form>

                <p class="auth-footer">Don't have an account? <a href="/register">Create one</a></p>
            </div>
        </section>

    </div>

    <script src="{{ url_for('static', filename='main.js') }}" nonce="{{ csp_nonce }}"></script>
</body>
</html>
