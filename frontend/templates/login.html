<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
    {% include "_head_perf.html" %}
</head>
<body class="lp-body">

    <div class="page">

        {% set nav_active = "login" %}
        {% include "_nav_public.html" %}

        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Welcome</p>
                <h1>Login</h1>

                {% if error %}
                <div class="error-box">{{ error }}</div>
                {% endif %}

                <form method="POST" action="/login" class="auth-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <div class="field-group">
                        <label>Username or Email</label>
                        <input type="text" name="login" required>
                    </div>

                    <div class="field-group">
                        <label>Password</label>
                        <input type="password" name="password" required>
                    </div>

                    <button type="submit" class="primary-button full-width" id="login-submit">Login</button>
                </form>

                {% if google_signin_enabled %}
                <div class="auth-oauth"{% if not google_signin_visible %} hidden{% endif %}>
                    <p class="auth-oauth-divider">or</p>
                    <a href="{{ url_for('google_oauth.start') }}" class="secondary-button full-width">Sign in with Google</a>
                </div>
                {% endif %}

                <p class="auth-footer">Don't have an account? <a href="/register">Create one</a></p>
            </div>
        </section>

    </div>

    <script nonce="{{ csp_nonce }}">
    (function () {
        const form = document.querySelector(".auth-form");
        const btn = document.getElementById("login-submit");
        if (!form || !btn) return;
        form.addEventListener("submit", function () {
            btn.disabled = true;
            btn.textContent = "Signing in…";
        });
    })();
    </script>
</body>
</html>
