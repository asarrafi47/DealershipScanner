<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventory{% endblock %} — Sarrafi Cars</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    {% include "_head_css.html" %}
    {% include "_head_meta.html" %}
    {% include "_head_perf.html" %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/16-admin-pages.css') }}?v={{ static_cache_ver }}">
</head>
<body class="app-layout-body dealer-inv-body">
<div class="page page--app-layout">
    {% set nav_active = "dealer_tools" %}
    {% include "_nav_sidebar.html" %}

    <main class="app-layout-main">
        <nav class="dealer-inv-subnav" aria-label="Dealer inventory sections">
            <a href="{{ url_for('dealer_portal.inventory_dashboard') }}"
               class="dealer-inv-subnav__link{% if request.endpoint == 'dealer_portal.inventory_dashboard' %} dealer-inv-subnav__link--active{% endif %}"
               {% if request.endpoint == 'dealer_portal.inventory_dashboard' %}aria-current="page"{% endif %}>Inventory dashboard</a>
            <a href="{{ url_for('dealer_portal.inventory_listings') }}"
               class="dealer-inv-subnav__link{% if request.endpoint == 'dealer_portal.inventory_listings' %} dealer-inv-subnav__link--active{% endif %}"
               {% if request.endpoint == 'dealer_portal.inventory_listings' %}aria-current="page"{% endif %}>Listings</a>
        </nav>

        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
