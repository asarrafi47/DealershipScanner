<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Inventory{% endblock %} — Sarrafi Cars</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
    {% include "_head_perf.html" %}
    <style nonce="{{ csp_nonce }}">
    /* Dealer inventory sub-nav (tab bar under the shared sidebar shell). */
    .dealer-inv-subnav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin: 0 0 20px;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(11, 31, 58, 0.12);
    }
    .dealer-inv-subnav__link {
        display: inline-block;
        padding: 8px 16px;
        border-radius: 999px;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        color: var(--navy, #0b1f3a);
        background: rgba(11, 31, 58, 0.06);
    }
    .dealer-inv-subnav__link:hover {
        background: rgba(11, 31, 58, 0.12);
    }
    .dealer-inv-subnav__link--active {
        color: #fff;
        background: var(--navy, #0b1f3a);
    }
    </style>
</head>
<body class="app-layout-body">
<div class="page page--app-layout">
    {% set nav_active = "dealer_tools" %}
    {% include "_nav_sidebar.html" %}

    <main class="app-layout-main">
        <nav class="dealer-inv-subnav" aria-label="Dealer inventory sections">
            <a href="{{ url_for('dealer_portal.inventory_dashboard') }}"
               class="dealer-inv-subnav__link{% if request.endpoint == 'dealer_portal.inventory_dashboard' %} dealer-inv-subnav__link--active{% endif %}"
               {% if request.endpoint == 'dealer_portal.inventory_dashboard' %}aria-current="page"{% endif %}>Inventory dashboard</a>
            <a href="{{ url_for('dealer_portal.inventory_listings') }}"
               class="dealer-inv-subnav__link{% if request.endpoint == 'dealer_portal.inventory_listings' %} dealer-inv-subnav__link--active{% endif %}"
               {% if request.endpoint == 'dealer_portal.inventory_listings' %}aria-current="page"{% endif %}>Listings</a>
        </nav>

        {% block content %}{% endblock %}
    </main>
</div>
</body>
</html>
