<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Email verification</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ static_cache_ver }}">
    {% include "_head_perf.html" %}
</head>
<body class="lp-body">
    <div class="page">
        {% set nav_active = "login" %}
        {% include "_nav_public.html" %}

        <section class="auth-section">
            <div class="auth-card">
                <p class="eyebrow">Account</p>
                <h1>Email verification</h1>

                <div class="{{ 'success-box' if ok else 'error-box' }}">
                    {{ message }}
                </div>

                <p style="margin-top:1.5rem;">
                    <a href="{{ url_for('login_page') }}">Back to login</a>
                    {% if session.get('user_id') %}
                    &nbsp;·&nbsp;
                    <form method="POST" action="{{ url_for('resend_verification') }}" style="display:inline;">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                        <button type="submit" class="link-button">Resend verification email</button>
                    </form>
                    {% endif %}
                </p>
            </div>
        </section>
    </div>
{% include "_footer_version.html" %}
</body>
</html>
